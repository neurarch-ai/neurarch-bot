name: 'neurarch-bot'
description: 'The Neurarch agent for model repos: every model change gets a plan on the pull request (params, cost, GPU fit, will it run) and a blocker turns the check red, plus a weekly report issue on every model you own.'
author: 'neurarch-ai'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  mode:
    description: '"pr" (default) plans the models a pull request touches and comments on it. "report" traces every model in the config at the current commit and upserts one issue titled "Neurarch weekly model report"; it never fails the job.'
    required: false
    default: 'pr'
  config:
    description: 'Path to the config listing the models to plan, relative to the repository root.'
    required: false
    default: '.neurarch.yml'
  api-key:
    description: 'A Neurarch API key (nrk_...). Optional; keyless calls are rate-limited per hour and per IP.'
    required: false
    default: ''
  fix:
    description: 'Set to "true" to let the bot try to fix a blocker: it patches a scratch worktree, re-traces and re-plans, and opens a pull request into the head branch of the pull request that broke it, but only if the new plan is legal and the parameter count is within 10 percent of that head. On failure it says what it tried and pushes nothing.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to push the fix branch, open the fix pull request and add one line to the plan comment. The default GITHUB_TOKEN works, but a pull request it opens does NOT trigger workflows, so the fix PR gets no bot check of its own; pass a PAT to get one.'
    required: false
    default: ${{ github.token }}
  fail-on-warn:
    description: 'Set to "true" to fail the check on warnings, not just blockers.'
    required: false
    default: 'false'
  comment-on-clean:
    description: 'Set to "true" to post a comment even when the traced structure is identical to the base and has no findings. Default: stay silent on a refactor that leaves the graph unchanged (an existing comment is still updated).'
    required: false
    default: 'false'
  python-version:
    description: 'Python version used to import the model and run the trace.'
    required: false
    default: '3.11'
  torch-index-url:
    description: 'Wheel index for torch. The default is the CPU build, which is all a trace needs.'
    required: false
    default: 'https://download.pytorch.org/whl/cpu'

outputs:
  legal:
    description: '"true" when every affected model will run (no blockers), else "false".'
    value: ${{ steps.bot.outputs.legal }}
  blockers:
    description: 'Total blockers across affected models.'
    value: ${{ steps.bot.outputs.blockers }}
  warnings:
    description: 'Total warnings across affected models.'
    value: ${{ steps.bot.outputs.warnings }}
  plans-json:
    description: 'JSON array, one row per affected model: target, input, status, legal, blockers, warnings, summary, params, cost, and the deltas when a base was traced.'
    value: ${{ steps.bot.outputs.plans-json }}
  fix-status:
    description: '"none", "not-fixed", "opened", "updated", "push-failed" or "pr-failed".'
    value: ${{ steps.fix.outputs.fix-status }}
  fix-pr-number:
    description: 'The number of the fix pull request, when one was opened or updated.'
    value: ${{ steps.fix.outputs.fix-pr-number }}
  fix-pr-url:
    description: 'The URL of the fix pull request, when one was opened or updated.'
    value: ${{ steps.fix.outputs.fix-pr-url }}
  issue-number:
    description: 'In report mode, the number of the weekly report issue that was created or updated.'
    value: ${{ steps.report.outputs.issue-number }}
  issue-url:
    description: 'In report mode, the URL of the weekly report issue.'
    value: ${{ steps.report.outputs.issue-url }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip (torch CPU wheel)
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: neurarch-bot-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles(format('{0}/requirements.txt', github.action_path)) }}-${{ inputs.torch-index-url }}
        restore-keys: |
          neurarch-bot-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install torch and neurarch-trace
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet torch --index-url "${{ inputs.torch-index-url }}"
        python -m pip install --quiet -r "${{ github.action_path }}/requirements.txt"
        python -m neurarch_trace --version

    # Report mode diffs against the last report, so the numbers it compares against have to be
    # read out of the issue before the body that carries them is overwritten.
    - name: Find the previous weekly report
      id: previous
      if: inputs.mode == 'report'
      uses: actions/github-script@v7
      env:
        PREVIOUS_PATH: ${{ runner.temp }}/neurarch-previous-report.md
      with:
        script: |
          const fs = require('fs');
          const title = 'Neurarch weekly model report';
          const marker = '<!-- neurarch-report -->';
          const { owner, repo } = context.repo;
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', per_page: 100,
          });
          const matching = issues.filter(i => !i.pull_request && i.title === title);
          const existing = matching.find(i => i.body && i.body.includes(marker)) || matching[0] || null;
          if (!existing) {
            core.info('neurarch-bot: no open weekly report issue yet; this run opens the first one.');
            return;
          }
          fs.writeFileSync(process.env.PREVIOUS_PATH, existing.body || '');
          core.setOutput('previous-path', process.env.PREVIOUS_PATH);
          core.setOutput('issue-number', String(existing.number));
          core.info(`neurarch-bot: previous report is issue #${existing.number}`);

    - name: Plan every affected model
      id: bot
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        INPUT_COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
        NEURARCH_PREVIOUS_REPORT: ${{ steps.previous.outputs.previous-path }}
      run: |
        # Never exit non-zero here: a composite action stops at the first failing step, and the
        # comment must be posted before the verdict fails the job (see the last step).
        python "${{ github.action_path }}/scripts/bot.py" || echo "fail=true" >> "$GITHUB_OUTPUT"

    - name: Post or update the PR comment
      if: inputs.mode != 'report' && github.event.pull_request.number && steps.bot.outputs.comment != 'none' && steps.bot.outputs.comment != ''
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ steps.bot.outputs.comment-path }}
        COMMENT_MODE: ${{ steps.bot.outputs.comment }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- neurarch-bot -->';
          const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c =>
            c.body && c.body.startsWith(marker) && c.user && c.user.type === 'Bot');
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info(`neurarch-bot: updated comment ${existing.id}`);
          } else if (process.env.COMMENT_MODE === 'create_or_update') {
            const created = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`neurarch-bot: created comment ${created.data.id}`);
          } else {
            core.info('neurarch-bot: nothing to post (no existing comment, and nothing worth a new one)');
          }

    - name: Upsert the weekly report issue
      id: report
      if: inputs.mode == 'report' && steps.bot.outputs.report == 'ready'
      uses: actions/github-script@v7
      env:
        BODY_PATH: ${{ steps.bot.outputs.report-body-path }}
        COMMENT_PATH: ${{ steps.bot.outputs.report-comment-path }}
        ISSUE_TITLE: ${{ steps.bot.outputs.report-title }}
        EXISTING: ${{ steps.previous.outputs.issue-number }}
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const body = fs.readFileSync(process.env.BODY_PATH, 'utf8');
          let number = Number(process.env.EXISTING || 0);
          if (number) {
            await github.rest.issues.update({ owner, repo, issue_number: number, body });
            const note = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body: note });
            core.info(`neurarch-bot: updated issue #${number} and commented on what changed`);
          } else {
            const created = await github.rest.issues.create({
              owner, repo, title: process.env.ISSUE_TITLE, body,
            });
            number = created.data.number;
            core.info(`neurarch-bot: opened issue #${number}`);
            // The label is a nicety: a repository that does not have it, or a token that cannot
            // write labels, must not turn a report into a failed run.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'neurarch' });
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['neurarch'] });
            } catch (e) {
              core.info(`neurarch-bot: no 'neurarch' label applied (${e.status || e.message})`);
            }
          }
          const url = `https://github.com/${owner}/${repo}/issues/${number}`;
          core.setOutput('issue-number', String(number));
          core.setOutput('issue-url', url);
          core.info(`neurarch-bot: ${url}`);

    # The fix runs AFTER the comment is posted, on purpose: the plan is the product and it must
    # reach the pull request whether or not a fix is possible. It talks to the plan step through
    # a state file rather than step outputs, because a plan's blockers do not fit in one.
    - name: Try to fix the blocker
      id: fix
      if: inputs.fix == 'true' && inputs.mode != 'report' && github.event.pull_request.number && steps.bot.outputs.blockers != '0' && steps.bot.outputs.blockers != ''
      shell: bash
      env:
        NEURARCH_STAGE: fix
        NEURARCH_STATE: ${{ steps.bot.outputs.state-path }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Never exit non-zero: a failed fix attempt is a line in the comment, not a second
        # reason for the job to be red. The blocker itself fails it in the last step.
        python "${{ github.action_path }}/scripts/bot.py" || echo "neurarch-bot: the fix step failed; the plan comment stands."

    # Report mode pins `fail` to false: findings are a record, not a gate. This step still runs
    # for a report that crashed outright, because a report that did not happen is a failure.
    - name: Fail on blockers
      if: steps.bot.outputs.fail == 'true'
      shell: bash
      run: |
        echo "neurarch-bot: ${{ steps.bot.outputs.blockers }} blocker(s), ${{ steps.bot.outputs.warnings }} warning(s); failing the job."
        exit 1
